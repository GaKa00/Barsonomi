name: Build and deploy Next.js app to Azure Web App - barsonomy

on:
  push:
    branches:
      - master
    paths: 
    - ./Barsonomy.Client
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies and build Next.js app
        working-directory: ./Barsonomy.Client
        run: |
          npm ci
          npm run build --if-present

      # Next.js Standalone requires public/ and .next/static/ copied into .next/standalone
      - name: Prepare standalone bundle
        working-directory: ./Barsonomy.Client
        run: |
          cp -r public .next/standalone/public || true
          cp -r .next/static .next/standalone/.next/static

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./Barsonomy.Client/.next/standalone
          include-hidden-files: true # Necessary for .next folder inside standalone

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./standalone

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_664F153019E74D429054DF01D25CC5EE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_379BE6E3851A4AE39F0E4E36CF6793EB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3B18D55F9A28431EBA79AC1279FEA26F }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'barsonomy'
          slot-name: 'Production'
          package: ./standalone
